[Match]
Distribution=|debian
Distribution=|ubuntu

[Content]
PrepareScripts=%D/mkosi/mkosi.images/build/mkosi.conf.d/debian-ubuntu/mkosi.prepare
Packages=
        cargo # Distro package builds use --auto-features enabled and may compile Rust shadows.
        clang-tidy
        coccinelle
        lcov
        liburing-dev
        mypy
        shellcheck
