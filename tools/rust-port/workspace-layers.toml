#
# The physical layout is deliberately stable: one Rust crate belongs beside
# the C subsystem it shadows. Lower rank numbers may not depend on higher or
# equal rank numbers. Unlisted members are applications at the default layer.

[policy]
member_layout = "src/<subsystem>/rust"
default_layer = "application"

[layers.substrate]
rank = 0
members = [
    "src/dbus/rust",
    "src/fundamental/rust",
    "src/platform/rust",
]

[layers.foundation]
rank = 1
members = [
    "src/basic/rust",
    "src/event-loop/rust",
]

[layers.library]
rank = 2
members = [
    "src/libsystemd/rust",
    "src/libsystemd-network/rust",
]

[layers.shared]
rank = 3
members = ["src/shared/rust"]

[layers.application]
rank = 4
