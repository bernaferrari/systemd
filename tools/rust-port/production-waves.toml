[[target.evidence]]
name = "cli"
state = "planned"
detail = "Rust has help/version and mode/path parsing, but exact C argument-count, errno, and diagnostic parity has no reviewed Linux comparison."

[[target.evidence]]
name = "mode-selection"
state = "planned"
detail = "Rust resolves the kernel command line before positional arguments, but every query_volatile_mode precedence and malformed-value case is not yet compared with C."

[[target.evidence]]
name = "abi"
state = "planned"
detail = "Meson builds a non-installed Rust static library and private C harness exports three test entry points; a release ABI inventory and ownership contract are not yet complete."

[[target.evidence]]
name = "mount-transition"
state = "missing"
detail = "The installed Rust binary intentionally refuses active mount transitions; no evidence proves C-equivalent bind, remount, move, overlay, or mount-attribute fallback behavior."

[[target.evidence]]
name = "privilege"
state = "missing"
detail = "Initrd root privileges, mount namespace assumptions, capability requirements, and symlink exposure have not been compared against the C executable."

[[target.evidence]]
name = "recovery"
state = "missing"
detail = "Failure injection does not yet prove cleanup and rollback for every temporary tmpfs, bind mount, overlay directory, unmount, and informational symlink path."

[[target.evidence]]
name = "linux-integration"
state = "planned"
detail = "A private-namespace Meson harness exists for preflight and active transitions, but no reproducible Linux CI result has been recorded for the complete matrix."

[[target.evidence]]
name = "differential"
state = "missing"
detail = "No same-fixture C/Rust trace compares mode selection, exit status, mount topology, symlink state, diagnostics, and cleanup."
