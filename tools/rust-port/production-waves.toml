[[target.evidence]]
name = "cli"
state = "planned"
detail = "Rust help/version and load/save parsing exist, but exact C option, errno, and logging parity lacks a Linux differential test."

[[target.evidence]]
name = "persistent-state"
state = "missing"
detail = "Rust does not yet prove C-equivalent ownership, durable update, anti-regression hashing, or malformed-file recovery."

[[target.evidence]]
name = "entropy-credit"
state = "missing"
detail = "Rust deliberately refuses automatic xattr/first-boot crediting; C's creditable-xattr lifecycle is not ported."

[[target.evidence]]
name = "privilege"
state = "missing"
detail = "The privileged /dev/urandom and seed-file ownership boundary has no isolated Linux comparison."

[[target.evidence]]
name = "recovery"
state = "missing"
detail = "Short reads, getrandom fallback, interrupted writes, and restart recovery lack C/Rust evidence."

[[target.evidence]]
name = "linux-integration"
state = "missing"
detail = "No real Linux service, filesystem, xattr, and kernel-random-pool integration case has passed."

[[target.evidence]]
name = "differential"
state = "missing"
detail = "No same-fixture C/Rust trace compares exit status, bytes, mode, xattrs, and cleanup."
