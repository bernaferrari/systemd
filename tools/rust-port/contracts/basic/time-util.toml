# One directory-scoped owner keeps the shared time_util C ABI visible while
# individual surfaces retain their own C authority and comparison fixture.
schema = 1
module = "time-util"
semantic_coverage = "partial"
source_structure = "independent"
deviation_policy = "explicit-only"
excluded_c_symbols = ["now", "now_nsec", "map_clock_usec", "parse_nsec", "format_timestamp_style", "format_timestamp_relative_full", "weekday_to_string"]

[authority]
c_headers = ["src/basic/time-util.h"]
c_sources = ["src/basic/time-util.c"]
rust_headers = ["src/basic/rust/time_util.h"]
rust_sources = ["src/basic/rust/time_util/conversion.rs", "src/basic/rust/time_util/formatting.rs", "src/basic/rust/time_util/parsing.rs", "src/basic/rust/time_util/types.rs"]

[[surface]]
id = "time-map-clock-usec-raw"
c_symbols = ["map_clock_usec_raw"]
rust_symbols = ["rs_map_clock_usec_raw"]
coverage = "exact"
abi = "c-exact"
bytes = "scalar"
errors = "none"
runtime = "none"
verification = "static-only"

[surface.static_fixture]
file = "tests-extra/test-time-util-rust.c"
