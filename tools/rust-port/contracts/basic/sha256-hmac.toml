[[surface]]
id = "sha256-validation"
c_symbols = ["sha256_is_valid"]
rust_symbols = ["rs_sha256_is_valid"]
coverage = "deviation"
abi = "c-exact"
bytes = "borrowed-cstr-opaque"
errors = "boolean"
runtime = "none"
verification = "static-only"
deviation_id = "sha256-validation-null-fail-closed"
deviation_rationale = "Rust returns false for NULL where C relies on caller preconditions; valid raw C strings are evaluated with the C grammar."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-29."

