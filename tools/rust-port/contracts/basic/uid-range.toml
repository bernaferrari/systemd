[[surface]]
id = "uid-range-ownership"
c_symbols = ["uid_range_free", "uid_range_copy"]
rust_symbols = ["rs_uid_range_free", "rs_uid_range_copy"]
coverage = "deviation"
abi = "c-exact"
bytes = "ptr-len-opaque"
errors = "negative-errno"
runtime = "none"
verification = "static-only"
deviation_id = "uid-range-required-output-fail-closed"
deviation_rationale = "Valid C-owned pointer-plus-length ranges retain C allocator ownership, null-free behavior, copy contents, and success-only output publication. Rust returns -EINVAL for malformed required output storage instead of reaching C assertion behavior."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-29."

