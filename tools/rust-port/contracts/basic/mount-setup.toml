schema = 1
module = "mount_setup"
semantic_coverage = "partial"
source_structure = "independent"
deviation_policy = "explicit-only"
excluded_c_symbols = ["mount_cgroupfs", "mount_setup_early", "mount_setup"]

[authority]
c_headers = ["src/shared/mount-setup.h"]
