[[surface]]
id = "hexdecoct-hexmem"
c_symbols = ["hexmem", "unhexmem_full"]
rust_symbols = ["rs_hexmem", "rs_unhexmem_full"]
coverage = "deviation"
abi = "c-exact"
bytes = "ptr-len-opaque"
errors = "negative-errno"
runtime = "none"
verification = "static-only"
deviation_id = "hexdecoct-null-fail-closed"
deviation_rationale = "The Rust facade rejects malformed NULL and pointer/length combinations instead of evaluating C assertion-only preconditions; valid inputs use libc-owned output storage and C-compatible success publication."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-29."

[surface.static_fixture]
file = "tests-extra/test-hexdecoct-rust.c"
meson_target = "test-hexdecoct-rust"
labels = ["hexdecoct-hexmem"]

