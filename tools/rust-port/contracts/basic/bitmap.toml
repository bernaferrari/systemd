[[surface]]
id = "bitmap-allocation"
c_symbols = ["bitmap_new", "bitmap_copy", "bitmap_free", "bitmap_ensure_allocated"]
rust_symbols = ["rs_bitmap_new", "rs_bitmap_copy", "rs_bitmap_free", "rs_bitmap_ensure_allocated"]
coverage = "deviation"
abi = "c-exact"
bytes = "ptr-len-opaque"
errors = "negative-errno"
runtime = "none"
verification = "static-only"
deviation_id = "bitmap-copy-null-fail-closed"
deviation_rationale = "Valid libc-owned Bitmap layout and cross-C/Rust allocation behavior are preserved. The Rust copy facade returns NULL for a malformed NULL input where C relies on its non-NULL precondition."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-29."

[surface.static_fixture]
file = "tests-extra/test-bitmap-rust.c"
meson_target = "test-bitmap-rust"
labels = ["bitmap-allocation"]

