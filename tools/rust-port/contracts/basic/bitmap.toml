bytes = "ptr-len-opaque"
errors = "negative-errno"
runtime = "none"
verification = "static-only"
deviation_id = "bitmap-required-pointer-fail-closed"
deviation_rationale = "For valid libc-owned Bitmap storage the resize, set, unset, and clear behavior is C-shaped. Rust returns -EINVAL or makes a no-op for C assertion-precondition violations instead of aborting."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-29."

