schema = 1
module = "bitmap"
semantic_coverage = "partial"
source_structure = "independent"
deviation_policy = "explicit-only"
excluded_c_symbols = ["BITMAP_FOREACH"]

[authority]
c_headers = ["src/shared/bitmap.h", "src/basic/iterator.h"]
c_sources = ["src/shared/bitmap.c"]
