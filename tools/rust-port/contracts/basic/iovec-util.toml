coverage = "exact"
abi = "c-exact"
bytes = "ptr-len-opaque"
errors = "none"
runtime = "none"
verification = "static-only"

[surface.static_fixture]
file = "tests-extra/test-iovec-util-rust.c"
meson_target = "test-iovec-util-rust"
labels = ["iovec-validation"]

