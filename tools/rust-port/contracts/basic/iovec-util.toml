schema = 1
module = "iovec-util"
semantic_coverage = "partial"
source_structure = "independent"
deviation_policy = "explicit-only"
excluded_c_symbols = [
    "iovec_shift",
    "iovec_inc",
    "iovec_done_erase",
    "set_iovec_string_field",
    "set_iovec_string_field_free",
    "iovec_array_free",
    "iovec_equal",
    "iovec_append",
]

[authority]
c_headers = ["src/basic/iovec-util.h", "src/fundamental/iovec-util.h"]
c_sources = ["src/basic/iovec-util.c"]
rust_headers = ["src/basic/rust/iovec_util.h"]
rust_sources = ["src/basic/rust/iovec_util.rs"]

[[surface]]
id = "iovec-validation"
c_symbols = ["iovec_is_set", "iovec_is_valid"]
