coverage = "exact"
abi = "c-exact"
bytes = "ptr-len-opaque"
errors = "boolean"
runtime = "none"
verification = "static-only"

[surface.static_fixture]
file = "tests-extra/test-utf8-rust.c"
meson_target = "test-utf8-rust"
labels = ["utf8-validation"]

