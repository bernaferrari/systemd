source_structure = "independent"
deviation_policy = "explicit-only"
excluded_c_symbols = [
    "get_credentials_dir",
    "get_encrypted_credentials_dir",
    "read_credential",
]

[authority]
c_headers = ["src/shared/creds-util.h"]
c_sources = ["src/shared/creds-util.c"]
rust_headers = ["src/basic/rust/credential_validators.h"]
