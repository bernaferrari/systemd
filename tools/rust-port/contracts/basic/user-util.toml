[[surface]]
id = "uid-parsing"
c_symbols = ["parse_uid", "parse_uid_range"]
rust_symbols = ["rs_parse_uid", "rs_parse_uid_range"]
coverage = "deviation"
abi = "c-exact"
bytes = "borrowed-cstr-opaque"
errors = "negative-errno"
runtime = "none"
verification = "static-only"
deviation_id = "uid-parser-null-fail-closed"
deviation_rationale = "Valid C strings preserve target-libc UID width, strict decimal syntax, errno selection, aliasing order, optional parse_uid output, and success-only publication. Rust returns -EINVAL without writing outputs for NULL inputs or required range outputs, where C asserts caller preconditions."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-30."

