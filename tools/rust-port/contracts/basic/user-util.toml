[[surface]]
id = "user-name-validation"
c_symbols = ["valid_user_group_name"]
rust_symbols = ["rs_valid_user_group_name"]
coverage = "deviation"
abi = "c-exact"
bytes = "borrowed-cstr-opaque"
errors = "boolean"
runtime = "none"
verification = "static-only"
deviation_id = "user-name-warn-no-log"
deviation_rationale = "Return values preserve the strict and relaxed byte rules, including NULL rejection. Rust intentionally does not emit C's VALID_USER_WARN structured log side effect."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-30."

[surface.static_fixture]
file = "tests-extra/test-user-util-rust.c"
meson_target = "test-user-util-rust"
labels = ["user-name-validation"]

