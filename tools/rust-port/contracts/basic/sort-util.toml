bytes = "ptr-len-opaque"
errors = "none"
runtime = "none"
verification = "static-only"
deviation_id = "sort-required-pointer-fail-closed"
deviation_rationale = "For valid raw element spans and synchronous C callbacks, Rust performs byte-wise swaps without typed reinterpretation or libc delegation. Invalid required pointers, zero element size, a missing callback, and overflow are no-ops rather than C assertion or undefined behavior."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-29."

