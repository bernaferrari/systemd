[[surface]]
id = "sort-comparators"
c_symbols = ["cmp_int", "cmp_uint16"]
rust_symbols = ["rs_cmp_int", "rs_cmp_uint16"]
coverage = "deviation"
abi = "c-exact"
bytes = "scalar"
errors = "none"
runtime = "none"
verification = "static-only"
deviation_id = "sort-comparator-null-fail-closed"
deviation_rationale = "Valid pointed scalar ordering preserves C comparison results. Rust returns equality for malformed NULL comparator inputs instead of C's invalid dereference contract."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-29."

[surface.static_fixture]
file = "tests-extra/test-sort-util-rust.c"
