schema = 1
module = "argv_util"
semantic_coverage = "partial"
source_structure = "independent"
deviation_policy = "explicit-only"
excluded_c_symbols = [
    "invoked_by_systemd",
    "rename_process_full",
    "save_argc_argv",
]

[authority]
c_headers = ["src/basic/argv-util.h"]
c_sources = ["src/basic/argv-util.c"]
rust_headers = ["src/basic/rust/argv_util.h"]
rust_sources = ["src/basic/rust/argv_util.rs"]

[[surface]]
id = "argv-invoked-as"
c_symbols = ["invoked_as"]
rust_symbols = ["rs_invoked_as"]
coverage = "exact"
abi = "c-exact"
bytes = "borrowed-cstr-opaque"
errors = "boolean"
runtime = "environment"
verification = "static-only"

[surface.static_fixture]
file = "tests-extra/test-argv-util-rust.c"
meson_target = "test-argv-util-rust"
labels = ["argv-invoked-as"]

[[surface]]
id = "argv-looks-like-help"
c_symbols = ["argv_looks_like_help"]
rust_symbols = ["rs_argv_looks_like_help"]
coverage = "exact"
abi = "c-exact"
bytes = "borrowed-cstr-opaque"
errors = "boolean"
runtime = "none"
verification = "static-only"

[surface.static_fixture]
file = "tests-extra/test-argv-util-rust.c"
meson_target = "test-argv-util-rust"
labels = ["argv-looks-like-help"]
