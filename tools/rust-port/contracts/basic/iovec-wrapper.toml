[[surface]]
id = "iovec-wrapper-cleanup"
c_symbols = ["iovw_done", "iovw_done_free", "iovw_free", "iovw_free_free"]
rust_symbols = ["rs_iovw_done", "rs_iovw_done_free", "rs_iovw_free", "rs_iovw_free_free"]
coverage = "deviation"
abi = "c-exact"
bytes = "ptr-len-opaque"
errors = "none"
runtime = "none"
verification = "static-only"
deviation_id = "iovec-wrapper-null-fail-closed"
deviation_rationale = "The valid repr(C) iovec array and libc release behavior match C. Rust treats malformed NULL cleanup inputs as no-ops rather than relying on assertion-precondition behavior."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-29."

[surface.static_fixture]
file = "tests-extra/test-iovec-wrapper-rust.c"
meson_target = "test-iovec-wrapper-rust"
labels = ["iovec-wrapper-cleanup"]

