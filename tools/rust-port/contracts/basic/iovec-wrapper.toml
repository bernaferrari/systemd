schema = 1
module = "iovec-wrapper"
semantic_coverage = "partial"
source_structure = "independent"
deviation_policy = "explicit-only"
excluded_c_symbols = ["iovw_compare", "iovw_equal", "iovw_put_full", "iovw_put_iov_full", "iovw_put_iovw_full", "iovw_consume_full", "iovw_consume_iov_full", "iovw_extend_full", "iovw_extend_iov_full", "iovw_extend_iovw_full", "iovw_put_string_field_full", "iovw_put_string_fieldf_full", "iovw_put_string_field_free", "iovw_concat", "iovw_to_cstring", "iovec_split", "iovw_merge"]

[authority]
c_headers = ["src/basic/iovec-wrapper.h", "src/basic/iovec-util.h", "src/basic/alloc-util.h"]
