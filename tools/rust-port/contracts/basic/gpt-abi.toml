verification = "static-only"
deviation_id = "gpt-label-allocation-fail-closed"
deviation_rationale = "For valid borrowed C strings, Rust preserves C's permissive UTF-8-to-UTF-16 length policy without allocation. C may return -ENOMEM while allocating its temporary UTF-16 buffer; the allocation-free Rust facade instead returns the computed boolean."
deviation_approval = "Reviewed static Rust-port boundary policy 2026-07-30."

