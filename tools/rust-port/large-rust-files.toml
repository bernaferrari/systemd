baseline_max_lines = 2401
issue = "systemd-cpuw"
reason = "Move the remaining vector mutation, splitting, and C ownership facades behind cohesive safe-core submodules."
growth_reason = "The safe C-compatible ownership facades gained bounded adapters during the unsafe-site reduction; retain this one-time cap while the tracked split remains deferred."

