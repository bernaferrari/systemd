#
# Production Rust files should stay below 2,000 lines. These entries acknowledge
# pre-existing architecture debt without allowing it to grow silently. A raised
# cap must retain its immutable original baseline and a reason, so review can
# distinguish an explicit one-time acknowledgement from a refreshed snapshot.
# Remove an entry as soon as the file is decomposed below the policy threshold.

[policy]
max_lines = 2000

