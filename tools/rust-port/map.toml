notes = "Source-local disconnected policy model only. A bounded private-wire slot now decodes at most one checked call, preserves SO_PEERCRED identity, reserves reply correlation before wake-aware manager submission, and retains the reply receiver with the peer. Listener admission now matches C's atomic `accept4(SOCK_NONBLOCK|SOCK_CLOEXEC)`, so a private peer cannot leak across an unrelated exec or be exposed as blocking between accept and registration. Wire readiness registration and explicit teardown are also modeled. The standard `org.freedesktop.DBus.Peer.Ping()` builtin is handled locally on any object path, with bounded correlated output and no manager-inbox consumption, matching sd-bus' transport-before-vtable architecture; `GetMachineId` is handled locally with cached canonical machine-ID formatting; lookup failure returns a bounded correlated `Failed` reply before manager submission. The new `pid1_api_bus_name_owner` model records C's API-bus RequestName flags, asynchronous ownership result, NameOwnerChanged loss, stale-session rejection, and close-driven release, but does not open or claim the production bus. The standard `org.freedesktop.DBus.Introspectable.Introspect()` request returns a bounded valid XML `s` reply with exact wire correlation, but describes only this developer-shadow's currently handled methods and intentionally omits `Properties`; it is not C's complete vtable XML. The public no-argument `Manager.ResetFailed()` now maps to a distinct all-loaded-units reset command and bounded empty reply, matching C's `manager_reset_failed()` iteration rather than abusing an empty unit name; its authorization remains transport policy. C's `Manager.ResetFailedUnit(s)` is now also a complete authenticated-wire slice: it uses the existing non-loading named reset runtime operation, emits an empty correlated reply, and maps an unknown unit to `org.freedesktop.systemd1.NoSuchUnit` instead of a generic manager error. The exact non-empty `GetUnit(s) -> o` read-only lookup now resolves only an already-loaded RuntimeManager unit and has authenticated-wire correlation coverage; it does not load unit files, and a missing unit returns C's `org.freedesktop.systemd1.NoSuchUnit` name with `Unit NAME not loaded.`. `GetUnitByPID(u) -> o` resolves an explicit PID or kernel-authenticated caller PID for zero. `GetUnitByInvocationID(ay) -> o` now performs the C-shaped, non-loading binary ID lookup with an invocation-ID-stable object path; a null ID resolves the authenticated caller, while a non-null miss returns `org.freedesktop.systemd1.NoUnitForInvocationID` with C's diagnostic. SELinux status checks remain unimplemented. A decoded, reply-expected request rejected before manager submission now retains a bounded typed D-Bus error with the exact request serial (unknown object/interface/method, invalid arguments, bounded-inbox limit, disconnected manager, or local failure); no-reply rejections are discarded as requested. Frames malformed before a safe request correlation is available still terminalize only that peer. A concrete same-thread host fixes the only valid turn ordering: post-epoll ingress, mutation of the exact RuntimeManager through the wake-aware inbox, then reply polling/output arming; it returns any manager objective to the outer lifecycle owner. The live PID 1 still has no production private socket lifecycle, complete D-Bus error/vtable/properties/signals surface, SELinux/polkit parity, system-bus name ownership transport, asynchronous GetId reply, or subscription serialization/coldplug. Therefore main must not bind `/run/systemd/private` yet. Production C remains authoritative."

