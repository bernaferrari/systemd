notes = "Safe UTF-8 argument and direct /proc/cmdline handling is implemented: current C enum/string-table values, optional-value kernel-command-line precedence, positional path validation (including path_equal-equivalent root spellings), and the inactive no/state success path. The volatile-mode tokenization now delegates to the shared Rust port of C's exact EXTRACT_UNQUOTE|EXTRACT_RELAX|EXTRACT_RETAIN_ESCAPE contract rather than retaining a second quote parser. Active modes perform side-effect-free mount-ID/mountinfo preflight, reject non-mount targets, and return success for an already temporary sysroot as C does. A typed injectable run orchestrator and concrete Linux composition backend preserve C's complete decision ordering: preflight, temporary-root information, backing-device discovery, warning-only /run/systemd/volatile-root symlink, then yes/overlay dispatch. Isolated Linux backends cover get_block_device_harder/device-mapper/Btrfs discovery, make_overlay's mkdir/tmpfs/upper/work/overlay/unmount/rmdir ordering with C-compatible backslash/comma/colon lowerdir escaping, and all make_volatile operations: kernel-enforced root-bounded /usr resolution (openat2 RESOLVE_IN_ROOT), tmpfs/bind/no-follow move operations, recursive read-only mount_setattr, and byte-preserving mountinfo-based best-effort recursive unmount. The Linux make_volatile backend does not approximate C's older-kernel chase/remount fallback: when its modern syscall hits C's fallback boundary, it fails closed with an inspectable typed requirement carrying the exact syscall and errno (and caches only the same unsupported errno families as C does for openat2 and mount_setattr). main now enters an explicit RefuseTransitions policy through a pure Linux preflight backend: it preserves inactive/already-temporary success and performs no discovery, link, or mount side effect on a non-temporary active root. Rust-init-milestones-only Meson C/R harnesses link the concrete Rust static archive with libsystemd-shared (resolving get_block_device_harder): one verifies `/proc` RefuseTransitions preflight, and another first unshares a private mount namespace, makes `/` private, shadows `/run` with tmpfs, then proves isolated yes and overlay transitions against recursive private bind mounts of `/`, including replacement filesystem type, `/usr`, and staging cleanup. The namespace test skips rather than retrying when authority or filesystem prerequisites are absent. These harnesses are not an installed-initrd proof, and AllowTransitions is not selected by the installed executable. The byte-oriented argv/cmdline interface, proc_cmdline_strv container/secure-environment source selection, C's old-kernel recursive remount fallback, live warning logging, installed-initrd namespace proof, and end-to-end transition remain unimplemented; a non-temporary yes/overlay request still fails closed before filesystem side effects. Meson builds volatile-root.c, so the Rust executable is not yet an installable replacement."

