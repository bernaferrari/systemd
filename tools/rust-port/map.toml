# SPDX-License-Identifier: LGPL-2.1-or-later
#
# C → Rust sync manifest for systemd shadow port.
# Each entry tracks a C source file and its Rust twin.
#
# status: "done" | "in-progress" | "todo"
# tier:   1 = pure computation, 2 = parsing with alloc, 3 = string ops, 4 = header inline
# test_file: corresponding test file path
# symbols: FFI exported functions count
# sync_status: "synced" | "partial" | "needs_review" | "out_of_date"
# header_file: associated C header file
#
# Source authority may be one-to-one (`c_file`, `rust_file`) or many-to-many
# (`c_paths`, `rust_paths`). Legacy comma-separated C and semicolon-separated
# Rust strings remain readable. Reviewed sticky states must eventually pin
# every path with singular `last_synced_{upstream,rust}_blob` fields for a
# one-path side, or exact path-to-blob `last_synced_{upstream,rust}_blobs`
# tables for a multi-path side. Never stamp a blob without reviewing parity.
#
# Idiomatic Rust decomposition uses `scope` plus `rust_scope_paths` as an
# inventory boundary. Directories recursively enumerate Rust leaves; they are
# never C behavior authority. `rust_paths` remains the exact materialized
# inventory and `rust_interface_paths` adds ABI headers or similar interfaces.
#
# `sync_status="partial"` is reserved for scoped static review with exact
# `last_reviewed_*` snapshots and a machine-checked `contract_file`. These
# hashes detect future drift without claiming full parity. Reserve
# `last_synced_*` and sync_status="synced" for completed parity.
#
# `src/fundamental/*-fundamental.{c,h}` names were retired upstream in
# 74d392ed1b. Entries use only canonical current paths; the sync gate preserves
# that reviewed rename history and rejects any retired authority spelling.

