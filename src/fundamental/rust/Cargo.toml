#
# Cargo.toml exists for IDE support (rust-analyzer) only.
# Meson is the authoritative build system — do NOT use `cargo build`.
#
# This crate is #![no_std] compatible — it provides fundamental
# utilities shared with the EFI boot code (sd-boot).

[package]
publish = false
name = "systemd-fundamental-rs"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["lib"]
name = "systemd_fundamental_rs"
path = "lib.rs"
