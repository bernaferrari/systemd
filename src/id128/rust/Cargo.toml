# Cargo.toml exists for IDE support (rust-analyzer) only.
# Meson is the authoritative build system — do NOT use `cargo build`.
[package]
publish = false
name = "systemd-id128-rs"
version = "0.0.1"
edition = "2024"
[dependencies]
systemd-libsystemd-rs = { path = "../../libsystemd/rust" }
libc = { workspace = true }
[lib]
crate-type = ["lib"]
name = "systemd_id128_rs"
path = "lib.rs"

[[bin]]
name = "systemd-id128"
path = "main.rs"
