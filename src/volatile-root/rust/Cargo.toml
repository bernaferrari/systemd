# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Cargo.toml exists for IDE support (rust-analyzer) only.
# Meson is the authoritative build system — do NOT use `cargo build`.
# No build.rs — all configuration comes from Meson.
#
# NOTE: `cargo test` will fail with linker errors because the Rust code
# calls back into C functions. Tests must be run via `meson test -C build`.

[package]
publish = false
name = "systemd-volatile-root-rs"
version = "0.0.1"
edition = "2024"

[dependencies]
systemd-basic-rs = { path = "../../basic/rust" }
systemd-shared-rs = { path = "../../shared/rust" }
systemd-platform-rs = { path = "../../platform/rust" }
libc = { workspace = true }

[lib]
# `staticlib` is consumed only by the Meson integration harness. The
# production Meson target remains the C executable until the full initrd
# transition contract is proven.
crate-type = ["lib", "staticlib"]
name = "systemd_volatile_root_rs"
path = "lib.rs"

[[bin]]
name = "systemd-volatile-root"
path = "main.rs"
