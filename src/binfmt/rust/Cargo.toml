#
# Cargo.toml exists for IDE support (rust-analyzer) only.
# Meson is the authoritative build system — do NOT use `cargo build`.
# No build.rs — all configuration comes from Meson.

[package]
publish = false
name = "systemd-binfmt-rs"
version = "0.0.1"
edition = "2021"

[dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[lib]
crate-type = ["lib"]
name = "systemd_binfmt_rs"
path = "lib.rs"

[[bin]]
name = "systemd-binfmt"
path = "main.rs"
