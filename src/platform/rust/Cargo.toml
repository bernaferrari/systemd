[package]
publish = false
name = "systemd-platform-rs"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"

[lib]
path = "lib.rs"

[dependencies]
libc = { workspace = true }
bitflags = { workspace = true }
nix = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5.6"
seccompiler = { version = "0.5.0", features = ["json"] }
