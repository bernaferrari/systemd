#
# Cargo.toml exists for IDE support (rust-analyzer) only.
# Meson is the authoritative build system — do NOT use `cargo build`.
# No build.rs — all configuration comes from Meson.

[package]
publish = false
name = "systemd-random-seed-rs"
version = "0.0.1"
edition = "2024"

[dependencies]
systemd-shared-rs = { path = "../../shared/rust" }
libc = { workspace = true }
nix = { workspace = true }
getrandom = "0.4"

[lib]
crate-type = ["lib"]
name = "systemd_random_seed_rs"
path = "lib.rs"

[[bin]]
name = "systemd-random-seed"
path = "main.rs"
