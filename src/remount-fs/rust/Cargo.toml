#
# Cargo.toml exists for IDE support (rust-analyzer) only.
# Meson is the authoritative build system — do NOT use `cargo build`.
# No build.rs — all configuration comes from Meson.

[package]
publish = false
name = "systemd-remount-fs-rs"
version = "0.0.1"
edition = "2024"

[dependencies]
systemd-shared-rs = { path = "../../shared/rust" }
systemd-platform-rs = { path = "../../platform/rust" }
libc = { workspace = true }

[lib]
crate-type = ["lib"]
name = "systemd_remount_fs_rs"
path = "lib.rs"

[[bin]]
name = "systemd-remount-fs"
path = "main.rs"
