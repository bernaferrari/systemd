#
# Cargo.toml exists for IDE support (rust-analyzer) only.
# Meson is the authoritative build system — do NOT use `cargo build`.
# No build.rs — all configuration comes from Meson.

[package]
publish = false
name = "systemd-udev-rs"
version = "0.0.1"
edition = "2024"

[dependencies]
libc = { workspace = true }
tokio = { workspace = true }
systemd-basic-rs = { path = "../../basic/rust" }
systemd-shared-rs = { path = "../../shared/rust" }
systemd-libsystemd-rs = { path = "../../libsystemd/rust" }
systemd-platform-rs = { path = "../../platform/rust" }
systemd-event-loop-rs = { path = "../../event-loop/rust" }

[lib]
crate-type = ["lib"]
name = "systemd_udev_rs"
path = "lib.rs"

[[bin]]
name = "systemd-udevd"
path = "main.rs"
