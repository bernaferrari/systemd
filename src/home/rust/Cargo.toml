[package]
publish = false
name = "systemd-home"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Rust port of systemd/src/home/"

[lib]
path = "lib.rs"

[dependencies]
systemd-shared-rs = { path = "../../shared/rust" }
bitflags = "2"
nix = { workspace = true }
systemd-platform-rs = { path = "../../platform/rust" }
systemd-event-loop-rs = { path = "../../event-loop/rust" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "systemd-homed"
path = "main.rs"
