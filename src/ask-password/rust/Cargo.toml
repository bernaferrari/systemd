#
# Cargo.toml exists for IDE support (rust-analyzer) only.
# Meson is the authoritative build system — do NOT use `cargo build`.
# No build.rs — all configuration comes from Meson.

[package]
publish = false
name = "systemd-ask-password-rs"
version = "0.0.1"
edition = "2021"

[dependencies]
bitflags = { workspace = true }
systemd-shared-rs = { path = "../../shared/rust" }
libc = "0.2"

[lib]
crate-type = ["lib"]
name = "systemd_ask_password_rs"
path = "lib.rs"

[[bin]]
name = "systemd-ask-password"
path = "main.rs"
